# Servidor
server.port=8085

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_telas
spring.datasource.username=postgres
spring.datasource.password=Aline123@
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ActiveMQ
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin
spring.activemq.in-memory=false
spring.activemq.pool.enabled=true
spring.activemq.pool.max-connections=5

# Nome da fila
app.queue.pedidos=fila.pedidos

# Logging
logging.level.com.ecommerce=DEBUG
logging.level.org.springframework.jms=INFO

jwt.secret=ecommerce-telas-chave-secreta-2026
jwt.expiration=86400000